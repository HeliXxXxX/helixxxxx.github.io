date: 2026-08-03
tags: [android, chess, kotlin]
---
# Passant

A chess app you play from your home screen. The widget is not a shortcut to the
app — it is the board. You tap a piece, you tap a square, the move goes out. The
app itself is the companion: start games, track whose turn it is, review what
happened.

## Why
Correspondence chess dies in the gap between moves. You open an app, you play,
you close it, and then you forget the game exists for two days. Putting a live
board on the home screen removes that gap entirely — your move is just there,
next to the weather.

It also refuses to look like a chess app. No wood board, no green-and-cream, none
of the conventions everyone copied from the same two websites.

## Three widgets
- Board View — the main one, a full board you can play from
- List View — every game you have going, one row each, whose turn it is
- Bar View — a compact strip for when the home screen is already full

## What it does
- Online games against friends, with match invites and push notifications
- Offline games against a bundled Stockfish engine
- Live rated games on Lichess, played from inside Passant while your opponent
  plays on lichess.org normally
- Head-to-head history — a running win/loss/draw record against each opponent
- Whole-app light and dark themes that follow the system

## Fair play
Online moves are refereed on the server. A chess engine runs in a Cloud Function,
replays the move you just made, and reverts it if it was never legal — so the
board cannot be edited by a modified client. It is a detect-and-revert design
rather than a validate-then-write one, because correspondence chess is sporadic
and nobody should wait on a cold start to move a pawn.

## Built with
- Kotlin, Jetpack Compose, Glance for the widgets
- Firebase — Firestore, Cloud Functions, Cloud Messaging
- Stockfish for the offline bot, Lichess Board API for live play

## Status
In closed testing on Google Play. Version 2.10.

- [Privacy policy](https://helixxxxx.github.io/Passant/)
`,

const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let state = { tabs: [HOME], active: HOME };

/* ---- routing ---- */
function open(path, push) {
  if (!exists(path)) return;
  if (!state.tabs.includes(path)) state.tabs.push(path);
  state.active = path;
  if (push !== false) location.hash = '#' + path;
  closeMenu();
  render();
}

function closeTab(path, ev) {
  if (ev) ev.stopPropagation();
  state.tabs = state.tabs.filter(t => t !== path);
  if (!state.tabs.length) state.tabs = [HOME];
  if (state.active === path) {
    state.active = state.tabs[state.tabs.length - 1];
    location.hash = '#' + state.active;
  }
  render();
}

function fromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  return exists(h) ? h : HOME;
}

/* ---- markdown-ish ---- */
function parse(src) {
  const lines = src.split('\n');
  const meta = {};
  const body = [];
  let front = false;
  lines.forEach((l, i) => {
    if (i === 0 && l === '---') { front = true; return; }
    if (front && l === '---') { front = false; return; }
    if (front) { const k = l.indexOf(':'); if (k > 0) meta[l.slice(0, k).trim()] = l.slice(k + 1).trim(); return; }
    body.push(l);
  });
  return { meta, body };
}

/* inline: `code` and [text](href) inside running text */
function inline(text) {
  let out = esc(text);
  out = out.replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
    if (/^(https?:|mailto:)/.test(href)) {
      return '<a class="inline" href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
    }
    return '<a class="inline" href="#' + href + '">' + label + '</a>';
  });
  return out;
}

function blocksFor(path) {
  const out = [];
  let n = 0;
  const para = [];
  const flush = () => {
    if (!para.length) return;
    out.push({ t: 'p', text: para.join(' ') });
    para.length = 0;
  };
  parse(FILES[path]).body.forEach(raw => {
    const l = raw.trim();
    if (!l) { flush(); return; }
    if (l.indexOf('# ') === 0)  { flush(); out.push({ t: 'h1', text: l.slice(2) }); n = 0; return; }
    if (l.indexOf('## ') === 0) { flush(); out.push({ t: 'h2', text: l.slice(3).toUpperCase() }); n = 0; return; }
    const numbered = /^\d+\.\s/.test(l);
    if (l.indexOf('- ') === 0 || numbered) {
      flush();
      n += 1;
      const bullet = numbered ? String(n).padStart(2, '0') : '—';
      const text = l.replace(/^-\s+/, '').replace(/^\d+\.\s+/, '');
      out.push({ t: 'li', bullet, text });
      return;
    }
    para.push(l);
  });
  flush();
  return out;
}

/* ---- render ---- */
function frame(p, big) {
  const cls = 'frame' + (big ? ' big' : '');
  return '<div class="' + cls + '">' +

    '<div class="status load">loading&hellip;</div>' +
    '<div class="status err">' + esc(p.src) + '<br>not found &mdash; add the file</div>' +

}

function renderTree() {
  const host = $('tree');

    const label = row.kind === 'dir' ? row.label
      : (isP ? PHOTOS[row.idx].file : row.path.split('/').pop());
    const el = document.createElement(path ? 'button' : 'div');
    el.className = 'row d' + row.depth + ' ' +
      (row.kind === 'dir' && !row.path ? 'dir' : 'file') +
      (path === state.active ? ' on' : '');
    el.textContent = label;
    if (path) el.onclick = () => open(path);
    host.appendChild(el);
  });

  $('sidefoot').innerHTML = SITE.links

      (/^https?:/.test(l.href) ? ' target="_blank" rel="noopener"' : '') +
      '>' + esc(l.label) + '</a>').join('');
}

function renderTabs() {
  const host = $('tabbar');

  state.tabs.forEach(t => {
    const p = photoAt(t);
    const label = t === SHEET ? 'photos/' : (p ? p.file : t.split('/').pop());
    const el = document.createElement('div');
    el.className = 'tab' + (t === state.active ? ' on' : '');
    el.innerHTML = '<span class="name"></span><span class="x">&times;</span>';
    el.querySelector('.name').textContent = label;
    el.querySelector('.name').onclick = () => open(t);
    el.querySelector('.x').onclick = (e) => closeTab(t, e);
    host.appendChild(el);
  });
}

function renderPage() {
  const host = $('page');

    host.querySelectorAll('.nav button').forEach(b => {
      b.onclick = () => open(photoPath(PHOTOS[(i + +b.dataset.d + PHOTOS.length) % PHOTOS.length]));
    });
    return;
  }

  /* markdown page */
  const src = FILES[active] ? active : HOME;
  const meta = parse(FILES[src]).meta;
  const metaLine = [meta.date, meta.tags ? meta.tags.replace(/[\[\]]/g, '') : null]
    .filter(Boolean).join('  ·  ');

  let html = '<div class="meta">' + esc(metaLine) + '</div>';
  blocksFor(src).forEach(b => {
    if (b.t === 'h1') html += '<h1 class="h1">' + esc(b.text) + '</h1>';
    else if (b.t === 'h2') html += '<h2 class="h2">' + esc(b.text) + '</h2>';
    else if (b.t === 'p') html += '<p class="p">' + inline(b.text) + '</p>';
    else if (b.t === 'li') html += '<div class="li"><span class="bullet">' + b.bullet +
      '</span><span class="txt">' + inline(b.text) + '</span></div>';
  });

  const oi = ORDER.indexOf(src);
  if (oi >= 0) {
    const prev = ORDER[(oi - 1 + ORDER.length) % ORDER.length];
    html += '<div class="pagefoot"><button data-go="' + prev + '">&larr; ' +
      prev.split('/').pop() + '</button></div>';
  }

  host.innerHTML = html;
  const back = host.querySelector('[data-go]');
  if (back) back.onclick = () => open(back.dataset.go);
}

function render() {
  $('titlePath').textContent = SITE.handle + ' / ' + (state.active === SHEET ? 'photos' : state.active);
  document.title = state.active === HOME
    ? SITE.handle
    : SITE.handle + ' / ' + state.active.split('/').pop();
  renderTree();
  renderTabs();
  renderPage();
}

/* ---- mobile menu ---- */
function closeMenu() {
  $('sidebar').classList.remove('open');
  $('scrim').classList.remove('on');
}
$('menuBtn').onclick = () => {
  $('sidebar').classList.toggle('open');
  $('scrim').classList.toggle('on');
};
$('scrim').onclick = closeMenu;

/* ---- boot ---- */
window.addEventListener('hashchange', () => {
  const h = fromHash();
  if (h !== state.active) open(h, false);
});

state.active = fromHash();
state.tabs = state.active === HOME ? [HOME] : [HOME, state.active];
render();
</script>
</body>
</html>
